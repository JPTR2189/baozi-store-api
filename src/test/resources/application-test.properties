# Perfil usado somente pelos testes automatizados:
# banco H2 em memoria, recriado do zero a cada execucao, para nao
# interferir no arquivo ./data/baozidb usado pela aplicacao real.
spring.datasource.url=jdbc:h2:mem:baozitest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
