# ============================================================
#  Baozi Store API - configuracao da aplicacao
# ============================================================

spring.application.name=baozi-store-api
server.port=8080

# ------------------------------------------------------------
#  Banco de dados relacional H2 em modo ARQUIVO
#  (permitido explicitamente pelo enunciado: "MySQL, MariaDB ou H2")
#
#  Modo arquivo (jdbc:h2:file:) e nao em memoria (jdbc:h2:mem:):
#  os dados criados pelo Postman permanecem salvos em ./data/baozidb.mv.db
#  mesmo depois de desligar a aplicacao.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update: o Hibernate cria e evolui as tabelas a partir
#  das entidades anotadas com @Entity, sem apagar os dados.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------
#  Console web do H2 - evidencia visual do banco configurado
#  Acesse http://localhost:8080/h2-console
#  JDBC URL: jdbc:h2:file:./data/baozidb   Usuario: sa   Senha: (vazia)
# ------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
#  JSON legivel nos prints do Postman
# ------------------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
